services:
  - type: web
    name: best-pocketfiles
    runtime: static
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./dist
    headers:
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /manifest.webmanifest
        name: Content-Type
        value: application/manifest+json
      - path: /manifest.webmanifest
        name: Cache-Control
        value: no-cache
